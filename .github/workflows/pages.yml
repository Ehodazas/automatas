name: Paskelbti GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci

      # 1) „Automatas“ – pagrindinis adresas
      - name: Build Automatas
        run: npm run build && mv out site
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"

      # 2) UAB „Autodalių pasaulis“ (neoficiali demonstracija) – /autodaliu-pasaulis/
      - name: Build Autodaliu pasaulis
        run: rm -rf .next && npm run build && mv out site/autodaliu-pasaulis
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE: autodaliu-pasaulis
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/autodaliu-pasaulis
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/autodaliu-pasaulis
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
